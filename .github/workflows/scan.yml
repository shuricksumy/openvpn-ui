name: Docker Image Vulnerability Scan
permissions:
  contents: read
  pull-requests: write
  security-events: write # for github/codeql-action/upload-sarif to upload the Docker Scout report

on:
  schedule:
    - cron: '30 1 */5 * *'
  workflow_dispatch: ~

jobs:
  vulnerability-scan:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout Repository
      uses: actions/checkout@v3
      
    # Step 2: Log in to Docker Hub with Docker Hub credentials
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    # Step 3: Pull the image from GitHub Packages
    - name: Pull Docker Image from GitHub Packages
      run: |
        docker pull ghcr.io/shuricksumy/openvpn-ui:latest

    # Step 4: Run Docker Scout to scan the image
    - name: Analyze for critical and high CVEs
      uses: docker/scout-action@v1
      id: docker-scout-cves
      with:
        command: cves,recommendations
        image: ghcr.io/shuricksumy/openvpn-ui:latest
        severity-cutoff: medium  # Adjust this as needed
        sarif-file: sarif.output.json
        summary: true

    - name: Upload Scan Report as Artifact
      uses: actions/upload-artifact@v7
      with:
        name: vulnerability-scan-report
        path: sarif.output.json

    # Docker Scout's sarif-file output was only ever archived as a downloadable artifact --
    # findings never reached the Security tab, so a new CVE surfacing on this workflow's 5-day
    # schedule would go unnoticed without manually opening a run and downloading the file.
    - name: Upload Docker Scout results to the Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: sarif.output.json
        category: docker-scout-scheduled
