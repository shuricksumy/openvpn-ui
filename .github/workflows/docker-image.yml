name: Build and Deploy Docker Images
permissions:
  contents: read
  pull-requests: write
  security-events: write # for github/codeql-action/upload-sarif to upload the Docker Scout report

on:
  push:
    branches:
      - my_main
    paths-ignore:
      - '.github/**'
      - '*.md'
  release:
    types: [published]
  workflow_dispatch: ~

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image for GitHub Container Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./DockerfileGitHub
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ${{ github.event_name == 'release' && format('ghcr.io/{0}:{1}', github.repository, github.event.release.tag_name) || '' }}

      - name: Build and Push Docker Image for Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./DockerfileGitHub
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/openvpn-ui:latest
            ${{ github.event_name == 'release' && format('{0}/openvpn-ui:{1}', secrets.DOCKER_USERNAME, github.event.release.tag_name) || '' }}

      - name: Pull Docker Image from GitHub Packages
        run: |
          docker pull ghcr.io/shuricksumy/openvpn-ui:latest

      - name: Analyze for critical and high CVEs
        uses: docker/scout-action@v1
        id: docker-scout-cves
        with:
          command: cves,recommendations
          image: ghcr.io/shuricksumy/openvpn-ui:latest
          sarif-file: sarif.output.json
          summary: true
  
      - name: Upload Scan Report as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-scan-report
          path: sarif.output.json

      # Docker Scout's sarif-file output was only ever archived as a downloadable artifact --
      # findings never reached the Security tab, so nobody would see a new CVE without manually
      # opening a workflow run and downloading the file. This surfaces them like hadolint.yml
      # already does for its own SARIF output. continue-on-error: true because Scout's SARIF for
      # this image has genuinely tripped GitHub's own per-result related-locations cap before
      # ("rejecting SARIF, as there are more related locations per result than allowed
      # (2427 > 1000)", confirmed live) -- a single widespread base-image CVE can legitimately
      # list more affected paths than that. The scan (and its artifact upload above) already ran
      # regardless; this step is a best-effort mirror to the Security tab, not something that
      # should fail the build when GitHub's own ingestion limit is hit.
      - name: Upload Docker Scout results to the Security tab
        uses: github/codeql-action/upload-sarif@v4.37.3
        continue-on-error: true
        with:
          sarif_file: sarif.output.json
          category: docker-scout
